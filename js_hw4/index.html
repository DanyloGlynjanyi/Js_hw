<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Functional-Expression</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-size: 25px;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-weight: bold;

            .p-creator {
                text-align: center;
                font-size: 25px;
                padding: 20px;
                margin: 20px auto;
                border: 3px solid #06293c;
            }

            .objCreator {
                width: 30vw;
                height: 10vh;
                display: flex;
                justify-content: center;
                align-items: center;
                border: 2px solid #680707;
                margin: 20px;
            }

            .objCreator li {
                list-style: none;
            }
        }

        li {
            list-style: square;
            margin: 5px;
            padding: 15px;
        }


    </style>
</head>
<body>
<script src="main.js"></script>
</body>
</html>
