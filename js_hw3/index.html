<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap');
        body {
            font-family: "Plus Jakarta Sans", serif;
            background: linear-gradient(to right, #1E3A8A, #3B82F6);
        }
        hr{
            border: 3px solid #170202;
        }
        div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 15px;
        }

        ul {
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #card_style {
           display: flex;
            align-items: center;

        }
        .product-card {
           display: flex;
            align-items: center;
            flex-direction: column;
        }
        h3 {
            font-size: 20px;
        }
        .product-image {
            width: 200px;
        }

        h1 {
            margin: 50px;
            text-align: center;
            color: aqua;
        }
    </style>
</head>
<body>
<script src="main.js"></script>
</body>
</html>
